name: target checks

# Installed on the target fork's default branch as .github/workflows/target-checks.yml.
# Runs automatically when a dev/* remediation branch is created (or via workflow_dispatch
# on force-pushed repair rounds) and publishes a GitHub Check Run on the pushed commit SHA.
on:
  create:
  workflow_dispatch:
    inputs:
      branch:
        description: Remediation branch name (dev/*)
        type: string
        required: true
      sha:
        description: Commit SHA to verify (optional; defaults to branch HEAD)
        type: string
        default: ""

permissions:
  contents: read
  checks: write

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'dev/'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target SHA
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVT_NAME: ${{ github.event_name }}
          EVT_REF: ${{ github.event.ref }}
          IN_BRANCH: ${{ inputs.branch }}
          IN_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          branch="${IN_BRANCH:-$EVT_REF}"
          sha="$IN_SHA"
          if [ -z "$sha" ]; then
            sha=$(gh api "repos/${{ github.repository }}/git/ref/heads/${branch}" --jq '.object.sha')
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 2

      - name: Verify commit diff and formatting
        id: check
        run: |
          set -euo pipefail
          files=$(git diff-tree --no-commit-id --name-only -r HEAD)
          if [ -z "$files" ]; then
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"
            echo "summary=Empty commit diff on HEAD." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bad_fmt=""
          if command -v gofmt >/dev/null 2>&1; then
            while IFS= read -r path; do
              case "$path" in
                vendor/*) continue ;;
                *.go)
                  if [ -f "$path" ]; then
                    out=$(gofmt -l "$path" || true)
                    if [ -n "$out" ]; then
                      bad_fmt="${bad_fmt:+${bad_fmt} }${out}"
                    fi
                  fi
                  ;;
              esac
            done <<< "$files"
          fi
          if [ -n "$bad_fmt" ]; then
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"
            echo "summary=Unformatted Go files: ${bad_fmt}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(printf '%s\n' "$files" | wc -l | tr -d ' ')
          echo "conclusion=success" >> "$GITHUB_OUTPUT"
          echo "summary=Verified ${count} changed file(s) on ${{ steps.target.outputs.branch }}." >> "$GITHUB_OUTPUT"

      - name: Publish target-checks Check Run
        if: always() && steps.target.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.target.outputs.sha }}
          CONCLUSION: ${{ steps.check.outputs.conclusion || 'failure' }}
          SUMMARY: ${{ steps.check.outputs.summary || 'Target check failed before completion.' }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/check-runs" \
            -f name="target-checks" \
            -f head_sha="$HEAD_SHA" \
            -f status="completed" \
            -f conclusion="$CONCLUSION" \
            -f "output[title]=Target repository checks" \
            -f "output[summary]=$SUMMARY" >/dev/null
